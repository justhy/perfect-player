name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# 允许 GITHUB_TOKEN 部署到 Pages（OIDC）
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只允许一个部署；不取消进行中的部署，避免覆盖已发布版本
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # 只打包游戏本体：两个 HTML 入口、.nojekyll 与 assets（约 491M）。
      # 不发布 tools/、tests/、.workbuddy 等仓库内部文件。
      - name: Stage site
        run: |
          rm -rf _site
          mkdir -p _site
          cp index.html nba-perfect-player.html .nojekyll _site/
          cp -r assets _site/assets

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
